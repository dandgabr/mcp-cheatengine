[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cheatengine"
version = "1.0.0"
description = "Servidor MCP (Model Context Protocol) para integração com Cheat Engine via IA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MCP Cheat Engine Community"}
]
keywords = ["mcp", "cheat-engine", "reverse-engineering", "memory-inspection", "ai-agent"]
dependencies = [
    "mcp>=1.0.0"
]

[project.scripts]
mcp-cheatengine = "mcp_cheatengine.server:main"

[tool.setuptools.packages.find]
where = ["src"]
